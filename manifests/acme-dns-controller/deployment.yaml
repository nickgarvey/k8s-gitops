apiVersion: apps/v1
kind: Deployment
metadata:
  name: garvey-sh-cert-controller
  namespace: acme-dns-controller
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garvey-sh-cert-controller
  template:
    metadata:
      labels:
        app: garvey-sh-cert-controller
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      serviceAccountName: garvey-sh-cert-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Dogfoods the in-cluster registry. Unlike acme-dns, this controller
          # is NOT bootstrap-critical: if it is down, cert-manager still renews
          # existing certs on its own; only provisioning of *new* AcmeDnsCerts
          # pauses. So pulling from oci.garvey.sh is fine. Bump the tag (not
          # :latest) to roll out a new build, then rollout restart.
          image: oci.garvey.sh/garvey-sh-cert-controller:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            # acme-dns account map Secret the acmeDNS solver also reads; the
            # controller owns it (see this dir's README for the migration off
            # the SopsSecret operator).
            - --account-secret=cert-manager/acme-dns
            - --account-secret-key=acmedns.json
            # Cluster pod CIDR; baked into each new acme-dns account's allowfrom.
            - --allow-from=2001:470:482f:100::/56
            # Cloudflare API token (Zone:DNS:Edit on garvey.sh), from secret.yaml.
            - --cloudflare-token-secret=acme-dns-controller/cloudflare-api-token
            - --cloudflare-token-key=api-token
            - --cloudflare-zone=garvey.sh
            - --leader-elect=false
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
