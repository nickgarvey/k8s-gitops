# Cloudflare API token for the cert-controller's delegation-CNAME upserts.
#
# ⚠️  THIS FILE IS AN UNENCRYPTED TEMPLATE. Before you commit or apply it:
#       1. Mint a Cloudflare API token scoped to  Zone : DNS : Edit  on garvey.sh.
#       2. Replace REPLACE_ME below with that token.
#       3. Seal it in place (the .sops.yaml rule matches manifests/*/secret.yaml,
#          encrypting only the stringData values):
#            nix run nixpkgs#sops -- --encrypt --in-place manifests/acme-dns-controller/secret.yaml
#       4. Confirm `git diff` shows the value as ENC[AES256_GCM,...] before committing.
#
# The controller reads this via --cloudflare-token-secret=acme-dns-controller/cloudflare-api-token
# and --cloudflare-token-key=api-token.
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: cloudflare-api-token-sopssecret
  namespace: acme-dns-controller
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  secretTemplates:
    - name: cloudflare-api-token
      type: Opaque
      labels:
        app.kubernetes.io/managed-by: ngarvey-homelab
      stringData:
        api-token: REPLACE_ME
