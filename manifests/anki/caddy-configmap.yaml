apiVersion: v1
kind: ConfigMap
metadata:
  name: anki-caddy
  namespace: anki
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  Caddyfile: |
    {
      auto_https off
      admin off
    }
    :80 {
      redir https://{host}{uri} permanent
    }
    :443 {
      tls /certs/tls.crt /certs/tls.key
      # [::1], not 127.0.0.1 as in the jellyfin Caddyfile: anki-sync-server is
      # started with SYNC_HOST="::" and opens no IPv4 socket at all (its
      # /proc/net/tcp is empty), so the v4 loopback would be refused.
      reverse_proxy http://[::1]:8080
    }
