apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-acmedns-prod
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: garvey.nick@gmail.com
    privateKeySecretRef:
      name: le-acmedns-prod-key
    solvers:
      - dns01:
          acmeDNS:
            host: http://acme-dns-api.acme-dns.svc.cluster.local
            accountSecretRef:
              name: acme-dns
              key: acmedns.json
