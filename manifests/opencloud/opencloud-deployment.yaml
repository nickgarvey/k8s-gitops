apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      securityContext:
        fsGroup: 1000
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - opencloud.bigeye-turtle.ts.net
      initContainers:
        - name: gen-cert
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -s /certs/tls.crt ]; then
                apk add --no-cache openssl >/dev/null
                openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                  -keyout /certs/tls.key -out /certs/tls.crt \
                  -subj "/CN=opencloud.bigeye-turtle.ts.net" \
                  -addext "subjectAltName=DNS:opencloud.bigeye-turtle.ts.net"
              fi
          volumeMounts:
            - name: caddy-certs
              mountPath: /certs
        # Initialise config + secrets ONLY on a fresh PVC. The existence guard
        # makes this idempotent: on an already-provisioned volume it is a no-op,
        # so re-applying can never regenerate secrets out of sync with the IDM
        # boltdb (the bug that caused the login 500). Replaces the old standalone
        # init Job and its broken `--force-overwrite no` (a value-less bool flag).
        - name: opencloud-init
          image: opencloudeu/opencloud-rolling:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command: ["sh", "-c"]
          args:
            - |
              if [ -e /etc/opencloud/opencloud.yaml ]; then
                echo "config present, skipping init"; exit 0
              fi
              exec opencloud init --insecure yes
          env:
            - name: OC_CONFIG_DIR
              value: /etc/opencloud
            - name: OC_BASE_DATA_PATH
              value: /var/lib/opencloud
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-storage
                  key: IDM_ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: etc
            - name: data
              mountPath: /var/lib/opencloud
              subPath: lib
      containers:
        - name: caddy
          image: caddy:2-alpine
          imagePullPolicy: IfNotPresent
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
          ports:
            - containerPort: 443
              name: https
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
            - name: caddy-data
              mountPath: /data
            - name: caddy-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: opencloud
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          image: opencloudeu/opencloud-rolling:latest
          imagePullPolicy: IfNotPresent
          command: ["opencloud"]
          args: ["server"]
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: OC_CONFIG_DIR
              value: /etc/opencloud
            - name: OC_BASE_DATA_PATH
              value: /var/lib/opencloud
            - name: OC_URL
              value: https://opencloud.bigeye-turtle.ts.net
            - name: PROXY_HTTP_ADDR
              value: 0.0.0.0:9200
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: "true"
            # --- external OIDC via authentik ---
            # The issuer hostname resolves in-cluster through the coredns-custom
            # rewrite (manifests/authentik/coredns-custom.yaml) to the authentik
            # Service's self-signed 9443 port; OC_INSECURE above covers that.
            - name: OC_OIDC_ISSUER
              value: https://authentik.bigeye-turtle.ts.net/application/o/opencloud/
            # Fallback client id for all platforms (web/desktop/mobile)
            - name: OC_OIDC_CLIENT_ID
              value: web
            # Built-in IDP off; idm stays (stores autoprovisioned users)
            - name: OC_EXCLUDE_RUN_SERVICES
              value: idp
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: GRAPH_USERNAME_MATCH
              value: none
            - name: PROXY_USER_OIDC_CLAIM
              value: preferred_username
            - name: PROXY_USER_CS3_CLAIM
              value: username
            # Admin/user roles come from the "roles" claim emitted by the
            # authentik "OpenCloud roles" scope mapping (blueprint).
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: oidc
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: roles
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "false"
            # authentik stamps tokens with a per-application issuer
            # (/application/o/opencloud-desktop/ for the desktop client), so
            # local JWT verification rejects every non-web client with "invalid
            # issuer". Validate access tokens via the userinfo endpoint instead.
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
              value: none
            - name: WEB_OIDC_SCOPE
              value: openid profile email offline_access
            # App tokens for WebDAV/rclone (opencloud auth-app create ...)
            - name: PROXY_ENABLE_APP_AUTH
              value: "true"
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: /etc/opencloud/csp.yaml
            - name: STORAGE_USERS_DRIVER
              value: decomposeds3
            - name: STORAGE_USERS_DECOMPOSEDS3_ENDPOINT
              value: http://storj-gateway.home.arpa:7777
            - name: STORAGE_USERS_DECOMPOSEDS3_REGION
              value: us-east-1
            - name: STORAGE_USERS_DECOMPOSEDS3_BUCKET
              value: opencloud
            - name: STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-storage
                  key: GATEWAY_S3_ACCESS_KEY
            - name: STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-storage
                  key: GATEWAY_S3_SECRET_KEY
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-storage
                  key: IDM_ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: etc
            - name: data
              mountPath: /var/lib/opencloud
              subPath: lib
            # subPath so the PVC-backed /etc/opencloud isn't shadowed
            - name: csp-config
              mountPath: /etc/opencloud/csp.yaml
              subPath: csp.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
        - name: caddy-config
          configMap:
            name: opencloud-caddy
        - name: caddy-data
          emptyDir: {}
        - name: caddy-certs
          emptyDir: {}
        - name: csp-config
          configMap:
            name: opencloud-csp
