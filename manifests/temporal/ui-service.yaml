apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: temporal
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    # Continues the ::5000 (zot) / ::5001 (jellyfin) run of public *.garvey.sh
    # services that terminate their own TLS -- they all serve 443, so the
    # "last hextet = the service's port" rule doesn't apply to these.
    io.cilium/lb-ipam-ips: "2001:470:482f:2::5002"
spec:
  type: LoadBalancer
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: temporal-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
