apiVersion: v1
kind: Service
metadata:
  name: juicefs-pd
  namespace: juicefs
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    # A free address from the pool. Matched by the juicefs-pd AAAA record in
    # nix-configs' modules/networking/dns.nix. Unlike the other LoadBalancers
    # here this carries no TLS and therefore no certificate -- see README.md.
    io.cilium/lb-ipam-ips: "2001:470:482f:2::5005"
spec:
  type: LoadBalancer
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: juicefs-pd
  ports:
    - name: client
      protocol: TCP
      port: 2379
      targetPort: 2379
---
# Headless service giving the PD pod a stable in-cluster name for TiKV to dial.
apiVersion: v1
kind: Service
metadata:
  name: juicefs-pd-peer
  namespace: juicefs
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  clusterIP: None
  # Load-bearing for bootstrap: PD must resolve its own --advertise-peer-url
  # before it is serving, and a headless service withholds DNS for a not-yet-
  # ready pod by default. Without this the single member deadlocks on start.
  publishNotReadyAddresses: true
  selector:
    app: juicefs-pd
  ports:
    - name: client
      protocol: TCP
      port: 2379
    - name: peer
      protocol: TCP
      port: 2380
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: juicefs-pd
  namespace: juicefs
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  serviceName: juicefs-pd-peer
  replicas: 1
  selector:
    matchLabels:
      app: juicefs-pd
  template:
    metadata:
      labels:
        app: juicefs-pd
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      containers:
        # PD is TiKV's placement driver: it holds cluster topology, allocates
        # region placement, and serves the timestamp oracle every JuiceFS
        # transaction needs. A single replica, so PD restarting stalls the
        # filesystem until it is back.
        #
        # Its data directory is on longhorn-wffc (2 replicas + the recurring-job
        # backup group) rather than the 1-replica class TiKV uses. TiKV can lose
        # a store and rebuild it from Raft; PD has no such peer, and
        # reconstructing it from the stores with pd-recover is painful.
        - name: pd
          image: pingcap/pd:v8.5.1
          imagePullPolicy: IfNotPresent
          command:
            - /pd-server
            - --name=juicefs-pd-0
            - --data-dir=/var/lib/pd/data
            # Listen on every address, v6-only cluster.
            - --client-urls=http://[::]:2379
            - --peer-urls=http://[::]:2380
            # The pod IP, NOT the LoadBalancer address. PD does not merely
            # publish this value: its embedded etcd client dials it, and a pod
            # cannot reach its own Service's LB IP here -- that hairpin fails
            # with EPERM (connect: operation not permitted), which kills PD on
            # startup. LAN clients are unaffected: they bootstrap against the LB
            # address, receive this pod IP in the member list, and re-dial it
            # directly over the routed pod CIDRs.
            - --advertise-client-urls=http://[$(POD_IP)]:2379
            - --advertise-peer-urls=http://juicefs-pd-0.juicefs-pd-peer.juicefs.svc.cluster.local:2380
            - --initial-cluster=juicefs-pd-0=http://juicefs-pd-0.juicefs-pd-peer.juicefs.svc.cluster.local:2380
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          readinessProbe:
            httpGet:
              path: /pd/api/v1/health
              port: 2379
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /pd/api/v1/health
              port: 2379
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/pd
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/managed-by: ngarvey-homelab
          recurring-job-group.longhorn.io/default: enabled
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-wffc
        resources:
          requests:
            # Topology and region bookkeeping only; it does not scale with the
            # number of files.
            storage: 10Gi
