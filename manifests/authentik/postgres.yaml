apiVersion: v1
kind: Service
metadata:
  name: authentik-postgres
  namespace: authentik
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  selector:
    app: authentik-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgres
  namespace: authentik
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  serviceName: authentik-postgres
  replicas: 1
  selector:
    matchLabels:
      app: authentik-postgres
  template:
    metadata:
      labels:
        app: authentik-postgres
        app.kubernetes.io/managed-by: ngarvey-homelab
    spec:
      containers:
        - name: postgres
          # authentik 2026.5 supports PostgreSQL 14-18.
          # IPv6: the official image entrypoint sets listen_addresses='*' and a
          # `host all all all` pg_hba rule, so v6-only pod networking works
          # without extra config -- do not add listen/bind overrides here.
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: authentik-postgres
          env:
            # Subdirectory so Longhorn's lost+found doesn't trip initdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "authentik", "-d", "authentik"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "authentik", "-d", "authentik"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/managed-by: ngarvey-homelab
          recurring-job-group.longhorn.io/default: enabled
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: longhorn-wffc
