apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubelet
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  jobLabel: k8s-app
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: kubelet
  endpoints:
    # Kubelet metrics
    - port: https-metrics
      scheme: https
      honorLabels: true
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelings:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
      metricRelabelings:
        # k3s serves the combined control-plane registry on :10250, so this
        # scrape duplicates the kube-apiserver ServiceMonitor 1:1 (etcd_* is
        # 18179 series under each job). Keep only what genuinely originates
        # from the kubelet/cAdvisor.
        - action: drop
          sourceLabels:
            - __name__
          regex: (apiserver|etcd|workqueue|scheduler|leader_election|authentication|authorization|rest_client|watch_cache|field_validation|serviceaccount|node_authorizer|disabled_metric|registered_metric|hidden_metric|kubernetes_feature)_.*
    # cAdvisor metrics
    - port: https-metrics
      scheme: https
      path: /metrics/cadvisor
      honorLabels: true
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelings:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
      metricRelabelings:
        # k3s serves the combined control-plane registry on :10250, so this
        # scrape duplicates the kube-apiserver ServiceMonitor 1:1 (etcd_* is
        # 18179 series under each job). Keep only what genuinely originates
        # from the kubelet/cAdvisor.
        - action: drop
          sourceLabels:
            - __name__
          regex: (apiserver|etcd|workqueue|scheduler|leader_election|authentication|authorization|rest_client|watch_cache|field_validation|serviceaccount|node_authorizer|disabled_metric|registered_metric|hidden_metric|kubernetes_feature)_.*
    # Probes metrics
    - port: https-metrics
      scheme: https
      path: /metrics/probes
      honorLabels: true
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelings:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
      metricRelabelings:
        # k3s serves the combined control-plane registry on :10250, so this
        # scrape duplicates the kube-apiserver ServiceMonitor 1:1 (etcd_* is
        # 18179 series under each job). Keep only what genuinely originates
        # from the kubelet/cAdvisor.
        - action: drop
          sourceLabels:
            - __name__
          regex: (apiserver|etcd|workqueue|scheduler|leader_election|authentication|authorization|rest_client|watch_cache|field_validation|serviceaccount|node_authorizer|disabled_metric|registered_metric|hidden_metric|kubernetes_feature)_.*

