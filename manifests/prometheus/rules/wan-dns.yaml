apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wan-dns-alerts
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
    prometheus: prometheus
spec:
  groups:
    - name: wan.dns
      rules:
        # Fed by modules/router/wan-dns-drift.nix on dragonsreach, which resolves
        # our published records through a public resolver and compares them to the
        # WAN interface's actual address.
        #
        # This is the early warning for the certificate alerts: the WAN IP is
        # DHCP-assigned but hardcoded in Cloudflare glue (twice) and in
        # modules/networking/zone.nix, with no DDNS automation. When it drifts,
        # Let's Encrypt can no longer reach our authoritative DNS and DNS-01
        # renewals start failing immediately -- but nothing else notices for weeks,
        # until certificates approach expiry. Catch it here in minutes instead.
        - alert: PublishedWanIPDrift
          expr: homelab_published_ip_matches_wan == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Public DNS for {{ $labels.record }} no longer matches the router's WAN IP"
            description: "{{ $labels.record }} no longer resolves to this router's WAN address from the public internet, so Let's Encrypt cannot reach our authoritative DNS and every DNS-01 renewal will fail. Query homelab_published_ip_info{record=\"{{ $labels.record }}\"} for the two addresses (published_ip=\"none\" means the lookup returned no answer at all). Fix by updating the Cloudflare glue for home.garvey.sh and acme.garvey.sh, and ns1 in modules/networking/zone.nix."

        # The drift check is push-based, so it going quiet is indistinguishable
        # from everything being fine unless we alert on the silence itself.
        - alert: WanDnsCheckMissing
          expr: absent(homelab_published_ip_matches_wan)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "The WAN-IP/DNS drift check has stopped reporting"
            description: "No homelab_published_ip_matches_wan samples for an hour -- check the vector service on dragonsreach. Until it recovers, WAN IP drift would go undetected."
