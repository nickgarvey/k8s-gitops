apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  version: v3.8.1
  serviceAccountName: prometheus

  # Select all ServiceMonitors, PodMonitors, and ScrapeConfigs across all namespaces
  serviceMonitorSelector: {}
  serviceMonitorNamespaceSelector: {}
  podMonitorSelector: {}
  podMonitorNamespaceSelector: {}
  scrapeConfigSelector: {}
  scrapeConfigNamespaceSelector: {}

  # Retention settings. Long-term data is shipped to Mimir (see remoteWrite),
  # so local Prometheus only needs a short window.
  retention: 7d

  # Replicate samples to Mimir for long-term storage on Storj.
  remoteWrite:
    - url: http://mimir.mimir.svc:8080/api/v1/push
      # Mimir keeps blocks forever, so only ship what is worth keeping forever.
      # Local Prometheus still holds every series at full resolution for the 7d
      # above, and Grafana has both datasources -- so anything dropped here is
      # still queryable for a week. All alerting evaluates in Prometheus, not
      # the Mimir ruler, so nothing here can break an alert.
      writeRelabelConfigs:
        # Histogram buckets are 70% of all series (160k of 232k) and no
        # dashboard or alert uses histogram_quantile. Long-term latency
        # quantiles are not worth 20GB of object storage.
        - action: drop
          sourceLabels:
            - __name__
          regex: .*_(bucket|sum|count)
        # Control-plane internals: useful live, worthless as a multi-year
        # archive. apiserver_* alone is half of all series.
        - action: drop
          sourceLabels:
            - __name__
          regex: (apiserver|etcd|workqueue|scheduler|rest_client|leader_election|authentication|authorization|storage_operation|csi|prober|kubernetes_feature)_.*

  # Storage configuration
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: longhorn-wffc
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 40Gi

  # Security context for storage permissions
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534

  # Enable admin API for lifecycle management
  enableAdminAPI: true

  # Accept pushed samples from host-level Vector agents
  enableRemoteWriteReceiver: true

  # AlertManager configuration
  alerting:
    alertmanagers:
      - namespace: prometheus
        name: alertmanager
        port: web

  # Select all PrometheusRules across all namespaces
  ruleSelector: {}
  ruleNamespaceSelector: {}

