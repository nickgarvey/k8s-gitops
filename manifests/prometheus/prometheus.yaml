apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
spec:
  replicas: 1
  version: v3.8.1
  serviceAccountName: prometheus

  # Select all ServiceMonitors, PodMonitors, and ScrapeConfigs across all namespaces
  serviceMonitorSelector: {}
  serviceMonitorNamespaceSelector: {}
  podMonitorSelector: {}
  podMonitorNamespaceSelector: {}
  scrapeConfigSelector: {}
  scrapeConfigNamespaceSelector: {}

  # Retention settings. Long-term data is shipped to Mimir (see remoteWrite),
  # so local Prometheus only needs a short window.
  retention: 7d

  # Replicate all samples to Mimir for long-term storage on Storj.
  remoteWrite:
    - url: http://mimir.mimir.svc:8080/api/v1/push

  # Storage configuration
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: longhorn-wffc
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 40Gi

  # Security context for storage permissions
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534

  # Enable admin API for lifecycle management
  enableAdminAPI: true

  # AlertManager configuration
  alerting:
    alertmanagers:
      - namespace: prometheus
        name: alertmanager
        port: web

  # Select all PrometheusRules across all namespaces
  ruleSelector: {}
  ruleNamespaceSelector: {}

