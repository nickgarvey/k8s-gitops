apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: zot
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/zot",
        "dedupe": false,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h",
        "storageDriver": {
          "name": "s3",
          "rootdirectory": "/zot",
          "region": "garage",
          "regionendpoint": "http://garage.home.arpa:3900",
          "bucket": "zot",
          "secure": false,
          "forcepathstyle": true
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "443",
        "tls": {
          "cert": "/etc/zot/tls/tls.crt",
          "key": "/etc/zot/tls/tls.key"
        }
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "ui": {
          "enable": true
        },
        "search": {
          "enable": true
        },
        "scrub": {
          "enable": true,
          "interval": "24h"
        }
      }
    }
