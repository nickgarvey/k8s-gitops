apiVersion: v1
kind: Service
metadata:
  name: acme-dns-dns
  namespace: acme-dns
  labels:
    app.kubernetes.io/managed-by: ngarvey-homelab
  annotations:
    # Static IPv6 from the Cilium LB pool, distinct from k8s-gateway (::53)
    # and zot (::5000). Globally routed but kept un-exposed on IPv6 by the
    # router's he-ipv6 -> LAN drop; reached only via the IPv4 DNAT path.
    io.cilium/lb-ipam-ips: "2001:470:482f:2::5300"
spec:
  type: LoadBalancer
  ipFamilies: [IPv6]
  ipFamilyPolicy: SingleStack
  selector:
    app: acme-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
